services:
  - type: web
    name: contact-guard-chat
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install --no-cache-dir -r requirements.txt && python -m pip show easyocr
    startCommand: python -m gunicorn app:app --timeout 60 --workers 1 --threads 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: CHAT_DB_PATH
        value: /var/data/contact_guard_chat.db
      - key: UPLOAD_DIR
        value: /var/data/contact_guard_uploads
