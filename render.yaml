services:
  - type: web
    name: contact-guard-chat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 4 --timeout 180
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: CHAT_DB_PATH
        value: /var/data/contact_guard_chat.db
      - key: UPLOAD_DIR
        value: /var/data/contact_guard_uploads
      - key: OCR_MODEL_DIR
        value: /var/data/easyocr_models
